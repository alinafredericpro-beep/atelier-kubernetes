apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: site
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: site      # le Service à viser
                port:
                  number: 80    # le "port" du Service (pas le targetPort)