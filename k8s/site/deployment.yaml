apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
  labels:
    app: site                 # label du Deployment lui-même (pour le retrouver)
spec:
  replicas: 3                # nombre de pods voulus
  selector:
    matchLabels:
      app: site               # "mes pods sont ceux qui ont app=site"
  template:                   # le MODÈLE de pod à fabriquer
    metadata:
      labels:
        app: site             # chaque pod créé reçoit ce label → doit = selector
    spec:
      containers:
        - name: nginx         # nom du conteneur (utilisé par "set image nginx=...")
          image: nginx:1.27   # image + tag précis (pas "latest" : on veut la même version partout)
          ports:
            - containerPort: 80   # documente le port écouté par nginx
          volumeMounts:
            - name: html                        # quel volume monter (nom défini plus bas)
              mountPath: /usr/share/nginx/html  # où le faire apparaître dans le conteneur
      volumes:
        - name: html          # déclaration du volume au niveau du pod
          configMap:
            name: site-html   # sa source : la ConfigMap