apiVersion: v1
kind: Service
metadata:
  name: site              # nom DNS interne : "site"
spec:
  type: ClusterIP         # IP interne au cluster uniquement
  selector:
    app: site             # envoie le trafic aux pods app=site
  ports:
    - name: http
      port: 80            # port sur lequel le SERVICE écoute
      targetPort: 80      # port du CONTENEUR vers lequel il transmet